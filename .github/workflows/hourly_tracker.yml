name: BMS Toxic CSWO Tracker

on:
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests gspread google-auth playwright
          fi

      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Create Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS" ]; then
            echo "ERROR: GOOGLE_CREDENTIALS secret is missing."
            exit 1
          fi

          printf '%s' "$GOOGLE_CREDENTIALS" > credentials.json

          echo "Google credentials file created."

          python - <<'PY'
          import json

          with open("credentials.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Google credentials JSON is valid.")
          print("Project ID:", data.get("project_id", "not found"))
          print("Client email:", data.get("client_email", "not found"))
          PY

      - name: Verify tracker files
        run: |
          echo "Working directory:"
          pwd

          echo ""
          echo "Repository files:"
          ls -la

          echo ""
          echo "Checking tracker.py:"
          test -f tracker.py

          echo ""
          echo "Checking credentials.json:"
          test -f credentials.json
          ls -lh credentials.json

      - name: Run tracker
        run: |
          python tracker.py

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bms-debug-${{ github.run_number }}
          path: |
            bms_debug/
            *.log
          if-no-files-found: ignore
