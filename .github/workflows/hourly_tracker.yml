name: BMS Toxic CSWO Tracker

on:
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          pip install gspread
          pip install google-auth
          pip install pytz
          pip install curl_cffi

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Verify Python Environment
        run: |
          python --version
          python -c "import playwright; print('Playwright OK')"
          python -c "import gspread; print('gspread OK')"
          python -c "import google.auth; print('Google Auth OK')"
          python -c "import pytz; print('pytz OK')"

      - name: Run BMS Tracker
        env:
          SPREADSHEET_ID: "1zzp8T0ergvrIcyqutlLTh6bzO2CBwfWT9xoaAMaCOO4"
          GCP_SA_KEY_B64: ${{ secrets.GCP_SA_KEY_B64 }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python tracker.py
