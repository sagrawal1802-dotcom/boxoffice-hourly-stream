name: BMS Hourly Ticket Stream

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi gspread google-auth pytz playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Execute Existing Stream Script
        env:
          SPREADSHEET_ID: "1zzp8T0ergvrIcyqutlLTh6bzO2CBwfWT9xoaAMaCOO4"
          PROXY_URL: ${{ secrets.PROXY_URL }}
          GCP_SA_KEY_B64: ${{ secrets.GCP_SA_KEY_B64 }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python tracker.py
